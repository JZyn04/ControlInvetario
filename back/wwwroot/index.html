<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Inventario</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero">
    <div>
      <h1>Control de inventario</h1>
      <p>Registra productos, controla existencias y detecta faltantes desde un solo lugar.</p>
    </div>
    <div class="metric">
      <span id="product-count">0</span>
      <small>productos</small>
    </div>
  </header>

  <main>
    <section class="card form-card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Movimiento</p>
          <h2 id="form-title">Nuevo producto</h2>
        </div>
        <button id="cancel-edit" class="button secondary hidden" type="button">Cancelar edición</button>
      </div>

      <form id="product-form">
        <input id="product-id" type="hidden">
        <label>Código<input id="code" maxlength="40" required placeholder="SKU-001"></label>
        <label class="wide">Producto<input id="name" maxlength="120" required placeholder="Nombre del producto"></label>
        <label>Existencia<input id="quantity" type="number" min="0" required value="0"></label>
        <label>Stock mínimo<input id="minimum-stock" type="number" min="0" required value="0"></label>
        <label>Precio unitario<input id="unit-price" type="number" min="0" step="0.01" required value="0"></label>
        <button class="button primary" type="submit">Guardar producto</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Inventario actual</p>
          <h2>Productos registrados</h2>
        </div>
        <button id="refresh" class="button secondary" type="button">Actualizar</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Código</th><th>Producto</th><th>Existencia</th><th>Mínimo</th><th>Precio</th><th>Estado</th><th></th></tr></thead>
          <tbody id="products"></tbody>
        </table>
        <p id="empty" class="empty hidden">Todavía no hay productos. Agregá el primero desde el formulario.</p>
      </div>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
