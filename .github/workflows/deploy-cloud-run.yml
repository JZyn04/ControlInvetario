name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Publicar API y frontend
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: control-inventario
          region: ${{ vars.GCP_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          source: ./back
          env_vars: ASPNETCORE_ENVIRONMENT=Production
          secrets: DATABASE_URL=neon-database-url:latest
          flags: --allow-unauthenticated --port=8080

      - name: Mostrar URL
        run: echo "${{ steps.deploy.outputs.url }}"
